name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog from tags
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -A1 "^${TAG}$" | tail -1)
          if [[ -z "$PREV_TAG" ]]; then
            PREV_TAG=$(git tag --sort=-v:refname | head -1)
          fi
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          
          if [[ "$TAG" != "$PREV_TAG" ]]; then
            git log --pretty=format:"- %s (%h)" "${PREV_TAG}..${TAG}" > changelog.txt || echo "No previous tag, showing all" > changelog.txt
          else
            echo "First release" > changelog.txt
          fi
          cat changelog.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: "Industry Chain Analysis ${{ steps.changelog.outputs.tag }}"
          body_path: changelog.txt
          draft: false
          prerelease: ${{ contains(steps.changelog.outputs.tag, 'rc') || contains(steps.changelog.outputs.tag, 'beta') || contains(steps.changelog.outputs.tag, 'alpha') }}
          files: |
            SKILL.md
            quick-reference.md
            theory/v9.2/framework.md
            theory/v10.x/v10.5.1.md
            cases/README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload full source as asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./industry-chain-analysis-${{ steps.changelog.outputs.tag }}.tar.gz
          asset_name: industry-chain-analysis-${{ steps.changelog.outputs.tag }}.tar.gz
          asset_content_type: application/gzip
