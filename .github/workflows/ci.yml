name: CI - 全链路自动化

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'      # 每日 03:00 UTC
  workflow_dispatch:

jobs:
  pipeline:
    name: 数据抓取 → 渲染 → 洞见 → 对比
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ========== 1️⃣ 数据抓取 ==========
      - name: Fetch public financial data (akshare / yfinance)
        run: python scripts/fetch_public_financial.py || true
        continue-on-error: true

      - name: Fetch public network data (pytrends / Alexa / News)
        run: python scripts/fetch_public_network.py || true
        continue-on-error: true

      - name: ETL - unify & dedup CSVs
        run: python scripts/etl_indicators.py

      # ========== 2️⃣ 渲染 & 洞见 ==========
      - name: Render cases with latest indicators
        run: python scripts/render_cases.py

      - name: Generate rule-based insights
        run: python scripts/generate_insights_template.py

      - name: Generate comparison dashboard
        run: python scripts/generate_comparison.py

      # ========== 3️⃣ 质量检查 ==========
      - name: Check required files exist
        run: |
          for f in README.md SKILL.md CHANGELOG.md LICENSE CONTRIBUTING.md \
                    theory/v9.2/framework.md theory/v10.x/v10.5.1.md \
                    scripts/fetch_public_financial.py scripts/render_cases.py \
                    requirements.txt; do
            [[ -f "$f" ]] && echo "✅ $f" || { echo "❌ Missing: $f"; exit 1; }
          done

      - name: Lint Markdown (non-blocking)
        run: |
          pip install markdownlint-cli2 2>/dev/null || true
          find . -name "*.md" -not -path "./.git/*" | xargs -r markdownlint-cli2 --config .markdownlint.json 2>/dev/null || true

      # ========== 4️⃣ 自动提交 ==========
      - name: Auto-commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/indicators/ cases/comparison/overview.html
          # Also add any case.md that changed
          git add cases/**/case.md
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "ci: auto-update indicators, rendered cases & dashboard"
          git push origin main
