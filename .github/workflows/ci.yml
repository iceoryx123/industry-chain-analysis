name: CI - 全链路自动化

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'      # 每日 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pipeline:
    name: 数据抓取 → 渲染 → 洞见 → 对比
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install akshare yfinance pytrends 2>/dev/null || true

      # ========== 1️⃣ 数据抓取 ==========
      - name: Fetch real financial data (akshare)
        run: python scripts/fetch_real_data.py || true
        continue-on-error: true

      - name: Fetch public network data (pytrends / optional)
        run: python scripts/fetch_public_network.py || true
        continue-on-error: true

      # ========== 2️⃣ 渲染 & 洞见 ==========
      - name: Re-generate template cases (ensure {{ indicator.xxx }} exist)
        run: |
          python scripts/generate_v9_cases.py
          python scripts/generate_v10_cases.py

      - name: Render cases with latest indicators
        run: python scripts/render_cases.py

      - name: Generate rule-based insights
        run: python scripts/generate_insights_template.py

      - name: Generate comparison dashboard
        run: python scripts/generate_comparison.py

      # ========== 3️⃣ 质量检查 ==========
      - name: Check required files exist
        run: |
          for f in README.md CHANGELOG.md LICENSE CONTRIBUTING.md \
                    theory/v9.2/framework.md theory/v10.x/v10.5.1.md \
                    scripts/fetch_real_data.py scripts/render_cases.py \
                    requirements.txt; do
            [[ -f "$f" ]] && echo "✅ $f" || { echo "❌ Missing: $f"; exit 1; }
          done
          # 验证所有行业都有 case.md
          echo "=== 行业覆盖 ==="
          find cases/by-industry -name "case.md" | wc -l

      - name: Lint Markdown (non-blocking)
        run: |
          pip install markdownlint-cli2 2>/dev/null || true
          find . -name "*.md" -not -path "./.git/*" | xargs -r markdownlint-cli2 --config .markdownlint.json 2>/dev/null || true

      # ========== 4️⃣ 自动提交 ==========
      - name: Auto-commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "ci: auto-update indicators, rendered cases & dashboard [skip ci]"
          git push
