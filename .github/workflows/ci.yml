name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node (for markdownlint)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint-cli
        run: npm ci 2>/dev/null || npm install -g markdownlint-cli

      - name: Lint Markdown files
        run: |
          find . -name "*.md" -not -path "./.git/*" -not -path "./node_modules/*" | xargs markdownlint --config .markdownlint.json || true

      - name: Check required files exist
        run: |
          required_files=(
            "README.md"
            "SKILL.md"
            "CHANGELOG.md"
            "LICENSE"
            "CONTRIBUTING.md"
            "docs/design/architecture.md"
            "docs/guides/quickstart.md"
            "theory/v9.2/framework.md"
            "theory/v10.x/v10.5.1.md"
            "cases/README.md"
          )
          for f in "${required_files[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "❌ Missing: $f"
              exit 1
            else
              echo "✅ Found: $f"
            fi
          done

      - name: Validate case index
        run: |
          if [[ -f "cases/README.md" ]]; then
            echo "📋 Case index exists"
            head -50 cases/README.md
          fi

  validate-links:
    name: Validate Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.markdown-link-check.json'

  spell-check:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run cspell
        uses: streetsidesoftware/cspell-action@v6
        with:
          files: '**/*.md'
          inline: true
