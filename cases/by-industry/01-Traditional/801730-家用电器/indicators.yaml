# 申万一级行业指标模板
# 所有案例复制此文件并填充实际数据

date: "2025-01-01"           # 数据统计日期
market_size_cny_bn: 0         # 行业市场规模（亿元人民币）
cr4: 0.0                      # 前四大企业市场份额（0-1）
hhi: 0                        # HHI 指数（0-10000）
gross_margin: 0.0             # 行业平均毛利率（0-1）
roe: 0.0                      # 行业平均ROE（0-1）
rd_intensity: 0.0             # 研发投入占收入比例（0-1）
network_intensity: 0.0        # 网络效应强度（0-1，仅平台类行业填写）
platform_users_million: 0     # 平台活跃用户（百万，仅平台类行业填写）
average_transaction_value_cny: 0  # 平均交易额（元，仅平台类行业填写）
